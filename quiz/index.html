<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Practice GitHub Copilot certification questions with instant answer feedback."
    />
    <title>GH-300 Practice Quizzes</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="GH-300 quizzes home">
          <span class="brand-mark" aria-hidden="true">GH</span>
          <span>GH-300 <span class="brand-muted">PRACTICE</span></span>
        </a>
        <span class="local-badge"><span aria-hidden="true"></span> Local study</span>
      </header>

      <main id="app" aria-live="polite">
        <div class="loading-panel">Loading your practice tests…</div>
      </main>

      <footer class="site-footer">
        <span>Practice locally. Your answers stay in this browser session.</span>
        <span>GH-300 Certification Prep</span>
      </footer>
    </div>
  </body>
</html>
